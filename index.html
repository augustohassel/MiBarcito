<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%pwa-192x192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="MiBarcito - Gestión inteligente de inventario de bebidas y recetario dinámico de coctelería" />
    <link rel="apple-touch-icon" href="%BASE_URL%pwa-192x192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <title>MiBarcito</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('mibarcito_theme');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            if (meta) meta.setAttribute('content', '#1f1f1f');
          } else {
            document.documentElement.classList.remove('dark');
            if (meta) meta.setAttribute('content', '#ffffff');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
          if (meta) meta.setAttribute('content', '#ffffff');
        }
      })();
    </script>
  </head>
  <body class="bg-surface text-on-surface min-h-screen font-sans antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
